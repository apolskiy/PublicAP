name: Emulator Test Suite

# End-to-end coverage for both HTTP service emulators.
#
# Only paths that can change emulator behaviour are watched: the practice/
# tree is unrelated exercise code and must not spend a pipeline run.
on:
  push:
    branches: [ master, main ]
    paths:
      - 'emulators/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
      - '.github/workflows/emulator-tests.yml'
  pull_request:
    paths:
      - 'emulators/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
  workflow_dispatch:

# Supersede an in-flight run for the same ref. The suite binds ephemeral ports
# and spawns processes, so there is nothing to be gained from overlapping runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # One emulator binds sockets and relies on process termination semantics,
      # which differ between platforms. A failure on one OS should not hide the
      # result on the other.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.12', '3.14' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Blocking gate, ahead of the suites: a hygiene regression should fail
      # before any process is spawned, not after a green test run buries it.
      - name: Static Analysis
        run: pylint --fail-under=10 emulators/tests emulators/image_tests emulators/flask_app/app.py emulators/custom_header_response_to_http_request.py

      # pytest-randomly shuffles collection order on every run, so the seed
      # printed in the header is what makes a failure reproducible.
      - name: Run Emulator Suites
        run: pytest

      # A suite that passes in only one order is not deterministic, it is lucky.
      # A second pass under a fixed, different seed proves the per-test process
      # isolation actually holds - without it the destructive control codes
      # (999 exits, 592 shuts down, 590 stalls) would leak between tests.
      - name: Verify Order Independence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: pytest --randomly-seed=20260730

      - name: Upload Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            reports/
