name: Container Image Tests

# Closes the seam between two checks that already existed and never met.
#
# `emulator-tests.yml` exercises the Flask simulator's SOURCE, through the WSGI
# client and a loopback server. A scheduled test in PlaywrightAPWebsiteAutomation
# reads the PUBLISHED IMAGE's dependency closure from the registry. An image
# built from stale source, or one whose CMD no longer starts, satisfies both: the
# source is fine, the layers carry the right packages, and nothing ever asked the
# artifact to answer a request.
#
# Both jobs below run the same suite, which imports its expectations from the
# source tree and asserts them against a container over HTTP. They differ only in
# which container, and that difference is the whole design:
#
#   built-image     - the image THIS COMMIT produces. A red here means the
#                     Dockerfile or the app is broken, and it is caught before
#                     anything is published.
#   published-image - the image on Docker Hub, against this branch's source. A
#                     red here means the published artifact and `main` disagree,
#                     which is usually "a change was merged and not published"
#                     and occasionally "the published image is wrong". Both are
#                     worth a notification; neither is a flake.
on:
  push:
    branches: [ master, main ]
    paths:
      - 'emulators/flask_app/**'
      - 'emulators/image_tests/**'
      - '.github/workflows/image-tests.yml'
  pull_request:
    paths:
      - 'emulators/flask_app/**'
      - 'emulators/image_tests/**'
  # Weekly, matching how this portfolio treats every check that depends on a
  # third party being reachable: registry availability has no business failing a
  # push, and image drift is a monthly risk rather than a per-commit one.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  built-image:
    name: Image built from this commit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Built and run by hand rather than declared as a `services:` container.
      # Service images are pulled before any step executes, so a job cannot
      # build an image and then use it as its own service - the artifact under
      # test would have to be published first, which is precisely the thing this
      # job exists to happen before.
      - name: Build the Image
        run: docker build -f emulators/flask_app/Dockerfile.dev -t flask_app:ci emulators/flask_app

      - name: Start the Container
        run: docker run -d --name errsim -p 4000:4000 flask_app:ci

      - name: Verify Container Posture
        run: |
          set -euo pipefail

          # Assertions that are not visible over HTTP, so the suite cannot make
          # them. A root-running image and one that ships its own build files
          # both answer requests perfectly well.
          RUNTIME_USER=$(docker exec errsim whoami)
          if [ "${RUNTIME_USER}" != "emulator" ]; then
            echo "::error::Container runs as '${RUNTIME_USER}', expected 'emulator'."
            exit 1
          fi

          CONTENTS=$(docker exec errsim ls /app | sort | tr '\n' ' ')
          if [ "${CONTENTS}" != "app.py requirements.txt " ]; then
            echo "::error::/app holds '${CONTENTS}', expected only app.py and requirements.txt."
            echo "::error::Build inputs reaching the image mean .dockerignore stopped excluding them."
            exit 1
          fi

          echo "Runs as ${RUNTIME_USER}; /app holds ${CONTENTS}"

      - name: Run Behavioural Suite Against the Container
        env:
          EMULATOR_BASE_URL: http://127.0.0.1:4000
        run: pytest emulators/image_tests

      - name: Container Logs
        if: always()
        run: docker logs errsim

      - name: Stop the Container
        if: always()
        run: docker rm -f errsim

  published-image:
    name: Published image against this source
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The service-container pattern this repository's README advertises to
    # consumers, used here on the repository's own published artifact.
    services:
      error-simulator:
        image: apolskiy/flask_app:latest
        ports:
          - 4000:4000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Behavioural Suite Against the Published Image
        env:
          EMULATOR_BASE_URL: http://127.0.0.1:4000
        run: |
          # A failure here compares the published image against this branch's
          # source. The usual cause is a merged change that has not been built
          # and pushed yet, and the fix is to publish rather than to edit a test.
          pytest emulators/image_tests
