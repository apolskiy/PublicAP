[pytest]
testpaths = emulators/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --html=reports/emulator-report.html
    --self-contained-html
    --junitxml=reports/emulator-results.xml

markers =
    slow: takes tens of seconds of wall clock; deselect with -m "not slow"

filterwarnings =
    error
    ignore::DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
